# Dependabot keeps dependencies current. Updates wait until npm's release-age
# cooldown in `.npmrc` has elapsed, so most supply-chain compromises get yanked
# before a PR ever opens.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns:
          - '*'
    # Node major bumps are not just-a-bump (LTS cadence, dev-loop knock-on
    # effects). Handle them manually; let Dependabot keep us current on
    # patches and minors only.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - docker
