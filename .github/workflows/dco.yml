name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      # Dependabot commits aren't DCO-signed. The bot identity is GitHub-managed
      # and can't be impersonated, and version-bump PRs have no human author whose
      # license attribution we'd be enforcing. Bypass DCO for Dependabot only; the
      # job still runs and reports SUCCESS so branch protection rules are happy.
      - name: Skip DCO for Dependabot
        if: github.actor == 'dependabot[bot]'
        run: echo "Dependabot PR -- skipping DCO sign-off check."
      - uses: actions/checkout@v6
        if: github.actor != 'dependabot[bot]'
        with:
          fetch-depth: 0
      # `pull_request.commits` is the integer commit count, not a list of SHAs,
      # so tim-actions/dco errored "commits is not iterable" on any multi-commit
      # PR. get-pr-commits returns a newline-separated SHA list which is what
      # the DCO action actually wants.
      - uses: tim-actions/get-pr-commits@198af03565609bb4ed924d1260247b4881f09e7d # v1.3.1
        if: github.actor != 'dependabot[bot]'
        id: get_pr_commits
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: DCO sign-off check
        if: github.actor != 'dependabot[bot]'
        uses: tim-actions/dco@2fd0504dc0d27b33f542867c300c60840c6dcb20 # v1.1.0
        with:
          commits: ${{ steps.get_pr_commits.outputs.commits }}
