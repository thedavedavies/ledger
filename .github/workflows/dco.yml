name: DCO

on:
  pull_request:
    branches: [main]

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      # Dependabot commits aren't DCO-signed. The bot identity is GitHub-managed
      # and can't be impersonated, and version-bump PRs have no human author whose
      # license attribution we'd be enforcing. Bypass DCO for Dependabot only; the
      # job still runs and reports SUCCESS so branch protection rules are happy.
      - name: Skip DCO for Dependabot
        if: github.actor == 'dependabot[bot]'
        run: echo "Dependabot PR -- skipping DCO sign-off check."
      - uses: actions/checkout@v6
        if: github.actor != 'dependabot[bot]'
        with:
          fetch-depth: 0
      - name: DCO sign-off check
        if: github.actor != 'dependabot[bot]'
        uses: tim-actions/dco@2fd0504dc0d27b33f542867c300c60840c6dcb20 # v1.1.0
        with:
          commits: ${{ github.event.pull_request.commits }}
