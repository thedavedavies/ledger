name: Bug report
description: Something is broken or behaving incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before filing, please skim
        the open issues to avoid duplicates. For security vulnerabilities, use
        the private advisory flow described in [SECURITY.md](../blob/main/SECURITY.md)
        instead of this form.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the unexpected behaviour.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps that consistently reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA, tag, or Docker image tag.
      placeholder: e.g. 6547fba or v0.1.0
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How are you running it?
      options:
        - Docker Compose (recommended self-host)
        - Local dev (pnpm dev)
        - Other (describe in additional context)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      description: Paste any relevant terminal output, browser console errors, or stack traces. Redact secrets.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, environment details, anything else that might help.
