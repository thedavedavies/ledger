name: Feature request
description: Suggest a change or new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check the scope notes in [README.md](../blob/main/README.md)
        and [AGENTS.md](../blob/main/AGENTS.md). Hosted-SaaS concerns (billing, multi-tenant
        infrastructure, plan gating, telemetry) are intentionally out of scope for the
        Community Edition. For larger ideas, a [discussion](https://github.com/thedavedavies/ledger/discussions)
        first usually goes further than a PR without prior context.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user-facing need, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you set them aside.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, prior art from similar tools, links to discussions, etc.
