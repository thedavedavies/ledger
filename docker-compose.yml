services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      # Must be URL-safe (letters/digits/hyphen/underscore) because it's
      # interpolated into DATABASE_URL below. See .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (URL-safe characters only; see .env.example)}
      POSTGRES_DB: invoice
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d invoice']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: pnpm exec tsx scripts/migrate.ts
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/invoice
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: node scripts/server.mjs
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/invoice
      PORT: '3000'
      UPLOADS_DIR: /app/uploads
      PDF_RENDER_CONCURRENCY: '4'
    ports:
      - '${BIND_HOST:-127.0.0.1}:${PORT:-3000}:3000'
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
